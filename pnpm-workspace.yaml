# Deliberately empty. The frontend that needed dependency overrides and build
# allowances was removed from this fork; the only remaining Node dependency is
# the Tauri CLI. The file itself stays because pnpm 11 reads it for the
# workspace root and Dockerfile/CI copy it alongside the lockfile.

allowBuilds:
  '@parcel/watcher': set this to true or false
  '@swc/core': set this to true or false
  esbuild: set this to true or false
  msw: set this to true or false
  sharp: set this to true or false
  unrs-resolver: set this to true or false
